# =================================================================
# Nginx Config: amezingpayservices.com → Web Frontend (static dist/)
# Copy to: /etc/nginx/sites-available/amezingpayservices.com
# Enable: sudo ln -s /etc/nginx/sites-available/amezingpayservices.com /etc/nginx/sites-enabled/
# =================================================================

# HTTP → HTTPS redirect (including www)
server {
    listen 80;
    server_name amezingpayservices.com www.amezingpayservices.com;
    return 301 https://amezingpayservices.com$request_uri;
}

# www → non-www redirect
server {
    listen 443 ssl http2;
    server_name www.amezingpayservices.com;

    ssl_certificate     /etc/letsencrypt/live/amezingpayservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amezingpayservices.com/privkey.pem;

    return 301 https://amezingpayservices.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name amezingpayservices.com;

    ssl_certificate     /etc/letsencrypt/live/amezingpayservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amezingpayservices.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/amezing_pay/web/dist;
    index index.html;

    # Vite build assets — content-hashed filenames, cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
        # Don't cache index.html itself (so new deploys are picked up)
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}
