# =================================================================
# Nginx Config: api.amezingpayservices.com → Backend (Node.js on port 4050)
# Copy to: /etc/nginx/sites-available/api.amezingpayservices.com
# Enable: sudo ln -s /etc/nginx/sites-available/api.amezingpayservices.com /etc/nginx/sites-enabled/
# =================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.amezingpayservices.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.amezingpayservices.com;

    # SSL — managed by Certbot (paths auto-populated after certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/api.amezingpayservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.amezingpayservices.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide server version
    server_tokens off;

    # Max request body — match backend express limit (1mb JSON + 10mb uploads)
    client_max_body_size 12M;

    # ──────────────────────────────────────────────
    # Webhook endpoints — CRITICAL: preserve raw body
    # proxy_request_buffering off prevents Nginx from
    # modifying the request body, which would break
    # HMAC signature verification for Cashfree/Razorpay.
    # ──────────────────────────────────────────────
    location /api/payments/webhook/ {
        proxy_pass         http://127.0.0.1:4050;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_request_buffering off;
    }

    location /api/wallet/topup/webhook {
        proxy_pass         http://127.0.0.1:4050;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_request_buffering off;
    }

    # All other API routes
    location / {
        proxy_pass         http://127.0.0.1:4050;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Block access to dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
