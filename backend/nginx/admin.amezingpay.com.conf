# =================================================================
# Nginx Config: admin.amezingpay.com → Admin Dashboard (static dist/)
# Copy to: /etc/nginx/sites-available/admin.amezingpay.com
# Enable: sudo ln -s /etc/nginx/sites-available/admin.amezingpay.com /etc/nginx/sites-enabled/
# =================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name admin.amezingpay.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.amezingpay.com;

    ssl_certificate     /etc/letsencrypt/live/admin.amezingpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.amezingpay.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;

    # ──────────────────────────────────────────────
    # Optional: IP allowlist for admin panel
    # Uncomment and set your office/home IP to restrict access.
    # This adds a network-level security layer on top of JWT auth.
    #
    # allow 203.0.113.10;     # Your office IP
    # allow 198.51.100.0/24;  # Your VPN range
    # deny all;
    # ──────────────────────────────────────────────

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/amezing_pay/admin/dist;
    index index.html;

    # Vite build assets — content-hashed filenames, cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}
